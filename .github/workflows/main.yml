name: "Build binaries"

on: [push]

env:
  CARGO_TERM_COLOR: always

jobs:
  release-linux-x86_64:
    name: Release Linux x86_64
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Build resvg
        run: cargo build --release

      - name: Collect
        working-directory: target/release
        run: |
          strip -s resvg
          tar cJf ../../resvg-linux-x86_64.tar.xz resvg

      - name: Upload binaries
        uses: actions/upload-artifact@v7
        with:
          name: resvg-linux-x86_64
          path: resvg-linux-x86_64.tar.xz
          archive: false
          retention-days: 1

  release-linux-aarch64:
    name: Release Linux AArch64
    runs-on: ubuntu-26.04-arm
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Build resvg
        run: cargo build --release

      - name: Collect
        working-directory: target/release
        run: |
          strip -s resvg
          tar cJf ../../resvg-linux-aarch64.tar.xz resvg

      - name: Upload binaries
        uses: actions/upload-artifact@v7
        with:
          name: resvg-linux-aarch64
          path: resvg-linux-aarch64.tar.xz
          archive: false
          retention-days: 1
